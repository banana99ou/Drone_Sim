# GENERATED by scripts/gen_assets.py. Do not edit by hand -- edit PARAMS
# in that script, rerun it, and the Gazebo model is regenerated to match.
#
# Generic quadrotor. These numbers model NO specific hardware; they were picked
# to fly well. The simulator is self-consistent, which is what matters for
# comparing planners against each other.
#
# Flight envelope implied by these values:
#   hover thrust        14.71 N total, 3.68 N per rotor
#   max thrust          36.00 N total
#   thrust-to-weight    2.45
#   hover rotor speed   639 rad/s (64% of max)
#   max lateral accel   ~8.3 m/s^2 at the 40 deg tilt clamp

drone:
  mass_kg: 1.5
  gravity_m_s2: 9.80665
  arm_length_m: 0.2
  radius_m: 0.3
  inertia:
    ixx: 0.015
    iyy: 0.015
    izz: 0.025
  rotor:
    count: 4
    # written with an explicit decimal point: YAML 1.1 parses "9e-06" as a
    # STRING, not a float, which only worked because the loader cast it.
    motor_constant: 9.0000e-06
    moment_constant: 0.016
    max_rot_velocity: 1000.0

  # Sensors. The IMU noise here MUST match what model.sdf gives the Gazebo
  # sensor -- both come from the same PARAMS, and scripts/check_sensors.py
  # measures the live data against these numbers rather than trusting them.
  sensors:
    imu:
      rate_hz: 250.0
      gyro_noise_rad_s: 1.0000e-03
      gyro_bias_rad_s: 2.0000e-04
      accel_noise_m_s2: 4.4000e-02
      accel_bias_m_s2: 2.0000e-02
    tof:
      min_range_m: 0.03
      max_range_m: 4.0
      fov_rad: 0.47
      noise_m: 1.0000e-02
      noise_frac: 1.0000e-02
      resolution_m: 1.0000e-03
      rate_hz: 30.0
    optical_flow:
      rate_hz: 50.0
      noise_rad_s: 2.0000e-02
      min_height_m: 0.1
      max_height_m: 3.0
      max_tilt_rad: 0.52
