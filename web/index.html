<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Drone_Sim viewer</title>
<!--
  Markup and styling only. Everything that moves is in js/, and everything
  PHYSICAL is computed on the ROS side and streamed here ready to draw -- see
  the rule at the top of js/app.js and src/dsim_viz/dsim_viz/overlay.py.

  No CDN, no framework, no build step: served straight off the sim host over a
  tailnet and opened on whatever is to hand, including an iPad.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #0d0f14; color: #e6e8ef;
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  .panel { position: fixed; background: rgba(18,21,28,.86); border: 1px solid #2a2f3d;
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(8px); }
  #hud { top: 12px; left: 12px; min-width: 226px; }
  #hud h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .02em; font-weight: 650; }
  #hud table { border-collapse: collapse; width: 100%; }
  #hud td { padding: 2px 0; font-variant-numeric: tabular-nums; }
  #hud td:first-child { color: #8b93a7; padding-right: 14px; }
  #hud td:last-child { text-align: right; font-weight: 600; }
  #hud tr.sep td { padding-top: 9px; color: #5d647a; font-size: 10px;
    text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
  #hud td#rot { font-size: 11px; letter-spacing: -.01em; }
  #ctl { top: 12px; right: 12px; width: 168px; }
  #ctl label.field { display: block; color: #8b93a7; margin: 0 0 4px; font-size: 10px;
    text-transform: uppercase; letter-spacing: .07em; }
  #ctl select, #ctl button { background: #1b1f2a; color: #e6e8ef; border: 1px solid #333a4a;
    border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%; }
  #ctl button { margin-top: 6px; cursor: pointer; }
  #ctl button:hover { background: #232837; }
  #ctl hr { border: 0; border-top: 1px solid #2a2f3d; margin: 10px 0 8px; }
  .check { display: flex; align-items: center; gap: 7px; margin: 3px 0;
    font-size: 12px; cursor: pointer; }
  .check input { margin: 0; accent-color: #60a5fa; }
  #gain { width: 100%; accent-color: #60a5fa; }
  #gainrow { display: flex; justify-content: space-between; color: #8b93a7;
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
  #legend { bottom: 12px; right: 12px; font-size: 11px; color: #a9b1c4; }
  #legend div { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
  #legend i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  #legend .note { display: block; color: #7b8398; margin-top: 6px; max-width: 168px; }
  #help { bottom: 12px; left: 12px; color: #7b8398; font-size: 11px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: 1px; }
  .up { background: #34d399; } .down { background: #f87171; }
  .bad { color: #f87171 !important; }
  .good { color: #34d399 !important; }
</style>

<canvas id="view"></canvas>

<div id="hud" class="panel">
  <h1><span id="link" class="dot down"></span><span id="linktext">connecting…</span></h1>
  <table>
    <tr><td>altitude</td><td id="alt">—</td></tr>
    <tr><td>speed</td><td id="spd">—</td></tr>
    <tr><td>tracking err</td><td id="err">—</td></tr>
    <tr><td>RMSE</td><td id="rmse">—</td></tr>
    <tr><td>clearance</td><td id="clr">—</td></tr>
    <tr><td>collision</td><td id="col">—</td></tr>
    <tr><td>elapsed</td><td id="ela">—</td></tr>
    <tr class="sep"><td colspan="2">control</td></tr>
    <tr><td>thrust</td><td id="thr">—</td></tr>
    <tr><td>rotors (N)</td><td id="rot">—</td></tr>
    <tr><td>tilt cmd</td><td id="tilt">—</td></tr>
    <tr><td>torque</td><td id="tau">—</td></tr>
    <tr><td>aero force</td><td id="aero">—</td></tr>
    <tr><td>authority</td><td id="sat">—</td></tr>
  </table>
</div>

<div id="ctl" class="panel">
  <label class="field" for="world">obstacle course</label>
  <select id="world"></select>
  <hr>
  <label class="field">overlays</label>
  <div id="groups"></div>
  <hr>
  <div id="gainrow"><span>arrow scale</span><span id="gainval">1.0x</span></div>
  <input type="range" id="gain" min="0.25" max="4" step="0.25" value="1">
  <hr>
  <button id="reset">reset view</button>
  <button id="clear">clear trails</button>
</div>

<div id="legend" class="panel"></div>
<div id="help" class="panel">drag orbit · wheel/pinch zoom · shift-drag pan</div>

<script type="module" src="js/app.js"></script>
